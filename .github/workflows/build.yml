name: Build card files

on:
  schedule:
    - cron: "30 22 * * *"   # nightly, after TCGCSV's daily refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # yesterday's files, so a game that fails tonight keeps its last good copy
      - name: Get last build
        run: |
          git fetch origin data || true
          if git rev-parse --verify -q origin/data >/dev/null; then git checkout origin/data -- cards; fi
      - name: Build
        run: python build.py
      # the data branch holds only the latest files (one commit, replaced nightly) so the repo stays small
      - name: Publish to the data branch
        run: |
          mkdir /tmp/out && cp -r cards /tmp/out/
          git config user.name "flavored-cardboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish
          git rm -rf --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/cards .
          printf "Card files built %s by build.py on main. See main's README.\n" "$(date -u +%F)" > README.md
          git add cards README.md
          git commit -qm "Card files $(date -u +%F)"
          git push -f origin publish:data
